[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enso-climate-analysis"
version = "0.1.0"
description = "Python workspace for exploring ENSO and related ocean-atmosphere data."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "xarray>=2024.7",
    "netCDF4>=1.7",
    "h5py>=3.11",
    "openpyxl>=3.1",
    "cdsapi>=0.7.7",
]

[project.optional-dependencies]
neural = ["torch>=2.6"]

[project.scripts]
enso-climate = "enso_climate.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

